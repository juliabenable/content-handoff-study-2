  if ((x = el('[data-rt-sort]'))) { const k = x.dataset.rtSort; S.rtSort = S.rtSort.key === k ? { key: k, dir: -S.rtSort.dir } : { key: k, dir: 1 }; render(); return; }

    if (id === 'all') { const ids = rtRows(MODELS()).filter(selectable).map(m => m.p.id); const on = ids.filter(i => S.sel.includes(i)); S.sel = on.length === ids.length ? [] : ids; }

  if ((x = el('[data-day]'))) { S.day = S.day === x.dataset.day ? null : x.dataset.day; S.filter = 'all'; render(); return; }
  if ((x = el('[data-prod-card]'))) { toast(`Opens the post on ${PLATFORM(pieceOf(x.dataset.prodCard).kind)} in a new tab`); return; }
  if ((x = el('[data-openpost]'))) { e.preventDefault(); e.stopPropagation(); toast(`Opens the post on ${PLATFORM(pieceOf(x.dataset.openpost).kind)} in a new tab`); return; }
  if ((x = el('.cs-extend[data-extend]'))) { e.stopPropagation(); openSheet(x.dataset.extend); return; }
  if ((x = el('[data-dl]'))) {
    /* a real download of the demo file; the card's Download must not open the popup */
    e.stopPropagation();
    const id = x.dataset.dl;
    if (x.tagName === 'A') markDownloaded(id); else downloadPiece(model(pieceOf(id)));
    toast('Downloading video'); setTimeout(render, 50); return;
  }
  if ((x = el('.tf-rowlink[data-open]'))) { e.stopPropagation(); S.open = x.dataset.open; S.sheet = null; render(); return; }
  if ((x = el('[data-row]'))) {
    const k = x.dataset.row; const open = !S.rowsOpen.includes(k);
    S.rowsOpen = open ? S.rowsOpen.concat(k) : S.rowsOpen.filter(i => i !== k);
    x.setAttribute('aria-expanded', String(open));
    const drawer = x.nextElementSibling; drawer.classList.toggle('tf-drawer--open', open); drawer.setAttribute('aria-hidden', String(!open)); drawer.toggleAttribute('inert', !open);
    const img = x.querySelector('.am-chev img'); if (img) img.style.rotate = open ? '-90deg' : '90deg';
    return;
  }
  if ((x = el('[data-open]'))) { if (!x.dataset.open) return; S.open = x.dataset.open; S.sheet = null; render(); return; }
  if ((x = el('[data-days]'))) {
    /* update in place: no re-render, the text box keeps its caret */
    S.sheetDays = Number(x.dataset.days);
    document.querySelectorAll('.cs-chip').forEach(c => { const on = Number(c.dataset.days) === S.sheetDays; c.classList.toggle('is-on', on); c.setAttribute('aria-pressed', String(on)); });
    const hint = document.getElementById('sheetHint'); if (hint) hint.textContent = sheetHint(sheetList());
    return;
  }
  if ((x = el('[data-act]'))) {
    const act = x.dataset.act; const id = x.dataset.id;
    if (act === 'dismiss') { S.dismissed = true; render(); }
    else if (act === 'show-ended') { S.filter = 'all'; S.day = null; const ended = MODELS().filter(m => m.state === 'ended' && !m.requested)[0]; if (ended) S.open = ended.p.id; render(); }
    else if (act === 'clear-day') { S.day = null; render(); }
    else if (act === 'cal-today') { const t = D(FORKS.today); calCursor = new Date(t.getFullYear(), t.getMonth(), 1); S.day = null; S.bigDay = null; render(); }
    else if (act === 'shelf-ended') { S.bucket = 'ended'; S.filter = 'all'; S.sel = []; render(); }
    else if (act === 'rt-ended') { S.rtFilter = 'ended'; S.rtView = 'table'; S.sel = []; render(); }
    else if (act === 'bulk-clear') { S.sel = []; render(); }
    else if (act === 'bulk-extend') { const ids = S.sel.filter(i => extendable(model(pieceOf(i)))); S.sheetSkipped = S.sel.length - ids.length; if (ids.length) openSolo(ids); }
    else if (act === 'bulk-dl') {
      const list = S.sel.map(i => model(pieceOf(i))).filter(usableFile);
      list.forEach((m, i) => setTimeout(() => { downloadPiece(m); if (i === list.length - 1) render(); }, i * 350));
      toast(`Downloading ${plural(list.length, 'video')}`);
    }
    else if (act === 'group-select') { const ids = shelfGroupIds(x.dataset.g); const on = ids.filter(i => S.sel.includes(i)); S.sel = on.length === ids.length ? S.sel.filter(i => !ids.includes(i)) : [...new Set(S.sel.concat(ids))]; render(); }
    else if (act === 'group-extend') { const ids = shelfGroupIds(x.dataset.g).filter(i => extendable(model(pieceOf(i)))); S.sheetSkipped = 0; if (ids.length) openSolo(ids); }
    else if (act === 'dl-all') {
      const only = x.dataset.ids !== undefined ? x.dataset.ids.split(',') : null;
      const list = MODELS().filter(m => m.state !== 'pending' && m.state !== 'ended' && (!only || only.includes(m.p.id)));
      list.forEach((m, i) => setTimeout(() => { downloadPiece(m); if (i === list.length - 1) render(); }, i * 350));
      toast(`Downloading ${plural(list.length, 'video')}`);
    }
    else if (act === 'close' || (act === 'close-scrim' && t === x)) { S.open = null; S.sheet = null; render(); }
    else if (act === 'copy') { if (navigator.clipboard) navigator.clipboard.writeText(pieceOf(id).cap.join('\n')).catch(()=>{}); toast('Caption copied'); }
    else if (act === 'sheet') { openSheet(id); }
    else if (act === 'sheet-close' && (t === x || el('.rvm-changes-close'))) { closeSheet(); }
    else if (act === 'sheet-send') {
      const of = document.getElementById('offer');
      const offer = FORKS.extend === 'price' ? Number(of && of.value) || 0 : null;
      if (FORKS.extend === 'price' && !(offer > 0)) { toast('Add an offer above $0'); if (of) of.focus(); return; }
      const ta = document.getElementById('sheetText');
      const ids = S.sheetSolo ? S.sheetIds.slice() : [id];
      ids.forEach(i => { S.ext[i] = { state:'requested', requested: FORKS.today, days: S.sheetDays, offer, note: ta ? ta.value : '' }; });
      save('ext', S.ext); S.sheet = null; S.sheetSolo = false; S.sheetIds = []; S.sheetFor = null; S.sheetText = ''; S.sel = [];
      toast(ids.length > 1 ? `${ids.length} requests sent to Katie's team` : FORKS.extend === 'price' ? 'Offer sent to Katie\'s team' : 'Sent to Katie\'s team'); render();
    }
    else if (act === 'demo-accept') { const cur = S.ext[id] || pieceOf(id).ext; S.ext[id] = { ...cur, state:'extended', accepted: FORKS.today }; save('ext', S.ext); toast(`${first(CREATORS[pieceOf(id).c])} accepted`); render(); }
    return;
  }
});
document.addEventListener('pointerdown', () => document.body.classList.add('is-pointer'), true);
document.addEventListener('keydown', (e) => { if (e.key === 'Tab' || e.key.startsWith('Arrow')) document.body.classList.remove('is-pointer'); }, true);
document.addEventListener('input', (e) => {
  if (e.target.id === 'offer') { S.sheetOffer = Number(e.target.value) || 0; const b = document.querySelector('.rvm-changes-send'); if (b) b.disabled = !(S.sheetOffer > 0); }
  if (e.target.id === 'sheetText') S.sheetText = e.target.value;
});
document.addEventListener('keydown', (e) => {
  /* Enter or Space on our own role=button / role=link elements acts like a click */
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"], [role="link"]') && !e.target.matches('button, a[href], input, textarea')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Escape') { if (S.sheet || S.sheetSolo) closeSheet(); else if (S.open) { S.open = null; render(); } return; }
  if ((S.open || S.sheetSolo) && !isProd() && e.key === 'Tab') {
    /* keep Tab inside the dialog (or inside the sheet when it is up) */
    const inSheet = S.sheet || S.sheetSolo;
    const scope = document.querySelector(inSheet ? '.rvm-changes-card' : '.rvm-shell'); if (!scope) return;
    const items = [...scope.querySelectorAll('a[href], button:not([disabled]), input, textarea, [tabindex="0"]')].filter(n => n.offsetParent !== null && (inSheet || !n.closest('.rvm-changes-scrim')));
    if (!items.length) return;
    const i = items.indexOf(document.activeElement);
    if (e.shiftKey && (i <= 0)) { e.preventDefault(); items[items.length - 1].focus(); }
    else if (!e.shiftKey && (i === -1 || i === items.length - 1)) { e.preventDefault(); items[0].focus(); }
    return;
  }
  if (S.open && !S.sheet && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.matches('input, textarea')) {
    const ms = MODELS(); const cur = ms.find(m => m.p.id === S.open); const sib = ms.filter(m => m.p.c === cur.p.c); const i = sib.indexOf(cur);
    const nx = sib[i + (e.key === 'ArrowRight' ? 1 : -1)]; if (nx) { S.open = nx.p.id; render(); }
  }
});
if (qs.get('open') && pieceOf(qs.get('open'))) S.open = qs.get('open');
render();
</script>
