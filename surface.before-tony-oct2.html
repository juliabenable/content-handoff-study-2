/* ------------------------------------------------------------------
   Content + rights surface. Every class is cs- prefixed; the captured
   production CSS owns the chrome (sidebar, header, tabs, stage card).
   Chrome-side rules are written as `.nf .cs-*` (0,2,0) because the
   captured CSS carries `.nf :where(.workflow-page) button` at (0,1,1).
   Type ramp 12/13/14/16/20 · spacing 4/8/12/16/24/32 · radii 8/12/16/999
   ------------------------------------------------------------------ */
html, body { margin: 0; }
body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.nf { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.nf .brand-dashboard { display: flex; flex-direction: column; height: 100vh; }
.nf .dashboard-body { flex: 1 1 0; min-height: 0; }
.nf .main-column { padding-bottom: 120px; }   /* the demo bar never hides the last row */

/* neutralise the captured chrome's bare button/anchor styling inside the panel (same specificity, loads later) */
.nf :where(.cs-panel) button, .nf :where(.cs-panel) a { margin: 0; padding: 0; border: 0; background: none; border-radius: 0; min-height: 0; font: inherit; color: inherit; line-height: inherit; text-decoration: none; }
.nf .cs-panel :focus-visible, .rvm :focus-visible, .cs-demo :focus-visible { outline: 2px solid #7a5cfa; outline-offset: 2px; }
.nf .cs-seg button:focus-visible { outline-offset: -2px; }
body.is-pointer .nf .cs-panel :focus-visible, body.is-pointer .rvm :focus-visible, body.is-pointer .cs-demo :focus-visible { outline: none; }

/* production has no "active" pill in the capture we hold; mirror the recruiting pill in green */
.nf .phase-pill.phase-pill--active { background: #e8f7ef; color: #15803d; }
.nf .phase-pill.phase-pill--active .phase-pill-dot { background: #2baf87; }
.nf .workflow-dashboard-tab { position: relative; }
.nf .workflow-dashboard-tab .cs-tabdot { position: absolute; top: 10px; right: -6px; width: 6px; height: 6px; border-radius: 999px; background: #e88e2c; }

/* the stage card becomes a two-column workspace: grid + rail */
.nf .stage-top-card.cs-panel { padding: 0; overflow: visible; }
.nf .cs-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; padding: 24px; align-items: start; }
.nf .cs-wrap.cs-wrap--prod { grid-template-columns: minmax(0, 1fr); padding: 24px 0; }

/* toolbar: production filter pills + download all */
.nf .cs-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.nf .cs-filters { display: flex; gap: 8px; flex-wrap: wrap; }
.nf .cs-filter { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 16px; border-radius: 999px; border: 1px solid #e3e3e3; background: #fff; color: #1a1a1a; font: 500 14px/1 Inter, sans-serif; cursor: pointer; transition: background-color .12s, border-color .12s; }
.nf .cs-filter:hover { border-color: #c6c6c6; }
.nf .cs-filter.is-on { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }
.nf .cs-filter .cs-count { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #f1f1f1; color: #4b4b4b; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.nf .cs-filter.is-on .cs-count { background: rgba(255,255,255,.18); color: #fff; }
.nf .cs-ghost { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #e3e3e3; background: #fff; color: #1a1a1a; font: 500 14px/1 Inter, sans-serif; cursor: pointer; transition: background-color .12s, border-color .12s; white-space: nowrap; }
.nf .cs-ghost:hover { background: #f7f7f8; border-color: #c6c6c6; }
.nf .cs-ghost svg { width: 16px; height: 16px; }
.nf .cs-ghost:disabled { color: #aaa; cursor: default; }
.nf .cs-ghost:disabled:hover { background: #fff; border-color: #e3e3e3; }

/* the quiet notice (logs in after something ended) */
.nf .cs-notice { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border: 1px solid #f3dfc0; background: #fff8ee; border-radius: 12px; margin-bottom: 20px; font-size: 14px; line-height: 1.5; color: #1a1a1a; }
.nf .cs-notice b { font-weight: 600; }
.nf .cs-notice-actions { display: flex; gap: 12px; align-items: center; flex: none; }

.nf .cs-link:hover { text-decoration: underline; }
.nf .cs-x { width: 28px; height: 28px; border-radius: 8px; border: 0; background: none; cursor: pointer; color: #717171; display: grid; place-items: center; font-size: 13px; }
.nf .cs-x:hover { background: rgba(0,0,0,.05); }

/* summary line above the grid, with the active day as a removable chip */
.nf .cs-sum { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; line-height: 20px; color: #6b7280; margin: 0 0 16px; min-height: 28px; }
.nf .cs-sum b { color: #1a1a1a; font-weight: 600; }
.nf .cs-sum .is-amber { color: #b45309; font-weight: 600; }
.nf .cs-sum .is-purple { color: #5b3fd6; font-weight: 600; }
.nf .cs-chipday { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: 999px; background: #1a1a1a; color: #fff; font: 500 13px/1 Inter, sans-serif; border: 0; cursor: pointer; }
.nf .cs-chipday span { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 11px; }

/* the cards (production anatomy: media, platform pill, creator row, caption) */

.nf .cs-card:hover { border-color: #e3e3e3; box-shadow: 0 1px 2px rgba(16,24,40,.05), 0 12px 28px rgba(16,24,40,.10); transform: translateY(-2px); }

.nf .cs-plat svg { width: 12px; height: 12px; }

.nf .cs-dl { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.94); color: #1a1a1a; font: 500 13px/1 Inter, sans-serif; border: 0; cursor: pointer; text-decoration: none; box-shadow: 0 1px 2px rgba(16,24,40,.08); }
.nf .cs-dl:hover { background: #fff; }
.nf .cs-dl svg { width: 14px; height: 14px; }
.nf .cs-body { flex: 1; padding: 14px 16px 14px; display: flex; flex-direction: column; gap: 8px; }
.nf .cs-who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.nf .cs-avatar { width: 28px; height: 28px; border-radius: 999px; overflow: hidden; background: #f1f1f1; flex: none; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #4b4b4b; }
.nf .cs-avatar img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.nf .cs-name { font-size: 14px; font-weight: 600; line-height: 18px; color: #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nf .cs-meta { font-size: 12px; line-height: 16px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nf .cs-cap { font-size: 13px; line-height: 18px; color: #4b4b4b; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 36px; }
.nf .cs-cap--3 { -webkit-line-clamp: 3; min-height: 54px; }
.nf .cs-rightsrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 10px; border-top: 1px solid #f1f1f1; min-height: 37px; }
.nf .cs-rights { font-size: 13px; line-height: 18px; color: #6b7280; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.nf .cs-rights > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.nf .cs-rights i { width: 6px; height: 6px; border-radius: 999px; background: #c2c5c4; flex: none; }
.nf .cs-rights.is-ext i { background: #2baf87; }
.nf .cs-rights b { font-weight: 500; color: #1a1a1a; }
.nf .cs-rights.is-ending i { background: #e88e2c; }
.nf .cs-rights.is-ending b { color: #b45309; }

.nf .cs-extend { flex: none; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid #e3e3e3; background: #fff; color: #1a1a1a; font: 500 12px/1 Inter, sans-serif; cursor: pointer; display: inline-flex; align-items: center; }
.nf .cs-extend:hover { border-color: #1a1a1a; }

.nf .cs-extend.is-amber:hover { border-color: #e88e2c; }
.nf .cs-empty { grid-column: 1 / -1; padding: 48px 24px; text-align: center; color: #6b7280; font-size: 14px; }

/* pending piece (draft approved, not live) */

.nf .cs-soon { position: absolute; inset: 0; display: grid; place-items: center; }
.nf .cs-soon span { padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid #ebebeb; font-size: 12px; font-weight: 500; color: #4b4b4b; }

/* ---- the rail: calendar + ending next + about ---- */
.nf .cs-rail { display: flex; flex-direction: column; gap: 16px; }

.nf .cs-box-sub { font-size: 13px; line-height: 18px; color: #6b7280; margin-bottom: 12px; }

.nf .cs-cal-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }

.nf .cs-day.is-blank { visibility: hidden; }
.nf .cs-day.is-past { color: #8a8a8a; }
.nf .cs-day.has { cursor: pointer; }
.nf .cs-day.has:hover { background: #f5f3fc; }
.nf .cs-day.is-today { font-weight: 600; color: #5b3fd6; background: #efecf7; border-radius: 999px; }

.nf .cs-day.is-sel, .nf .cs-day.is-sel:hover, .nf .cs-day.is-sel.has:hover, .nf .cs-day.is-today.is-sel.has:hover { background: #1a1a1a; color: #fff; }
.nf .cs-day.is-sel .cs-dot { background: #fff !important; box-shadow: none !important; }
.nf .cs-dots { display: flex; gap: 2px; height: 5px; }

.nf .cs-dot.is-req { background: #fff; box-shadow: inset 0 0 0 1.5px #896bd9; }

/* state chip + 90-day meter: the "where are we" the panel was missing */
.cs-state { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .01em; margin-bottom: 12px; }
.cs-state i { width: 7px; height: 7px; border-radius: 999px; background: currentColor; }
.cs-state--active { background: #e8f7ef; color: #15803d; }
.cs-state--ending { background: #fff4e5; color: #b45309; }
.cs-state--ended { background: #f1f1f3; color: #52525b; }
.cs-state--requested { background: #efecf7; color: #5b3fd6; }
.cs-state--extended { background: #e8f7ef; color: #15803d; }
.cs-state--pending { background: #f1f1f3; color: #5f5f66; }
.cs-meter { margin-top: 20px; }
.cs-meter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; line-height: 18px; color: #717171; font-variant-numeric: tabular-nums; }
.cs-meter-top b { font-weight: 600; color: #1c1c1c; }
.cs-meter--ending .cs-meter-top b { color: #b45309; }
.cs-meter--extended .cs-meter-top b { color: #15803d; }
.cs-meter--ended .cs-meter-top b { color: #52525b; }
.cs-meter-bar { position: relative; height: 6px; border-radius: 999px; background: #ececf1; }
.cs-meter-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: #2baf87; }
.cs-meter--ending .cs-meter-fill { background: #e88e2c; }
.cs-meter--ended .cs-meter-fill { background: #c2c5c4; }
.cs-meter-ext { position: absolute; top: 0; bottom: 0; right: 0; border-radius: 0 999px 999px 0; background: #e8f7ef; box-shadow: inset 0 0 0 1px #9fdcc4; }
.cs-meter-today { position: absolute; top: -4px; width: 2px; height: 14px; background: #1c1c1c; border-radius: 2px; transform: translateX(-1px); }
.cs-meter-labels { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; line-height: 16px; color: #717171; font-variant-numeric: tabular-nums; }

.cs-p-block { margin-top: 20px; border: 1px solid #ececf1; border-radius: 14px; overflow: hidden; }
.cs-p-block-title { font-size: 13px; font-weight: 600; color: #1c1c1c; padding: 12px 16px 0; }
.cs-p-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.cs-p-row + .cs-p-row { border-top: 1px solid #f1f1f3; }
.cs-p-row-txt { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cs-p-row-name { font-size: 14px; font-weight: 500; color: #1c1c1c; line-height: 18px; }
.cs-p-row-meta { font-size: 12px; color: #717171; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.cs-p-btn { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #e3e3e3; background: #fff; color: #1c1c1c; font: 500 13px/1 Inter, sans-serif; cursor: pointer; transition: background-color .12s; text-decoration: none; }
.cs-p-btn:hover { background: #f7f7f8; }
.cs-p-btn:disabled { color: #aaa; cursor: default; }
.cs-p-btn svg { width: 14px; height: 14px; }
.cs-receipt { font-size: 12px; color: #717171; padding: 0 16px 12px; }
.cs-p-note { margin-top: 16px; font-size: 13.5px; line-height: 20px; color: #717171; }
.cs-p-note b { color: #1c1c1c; font-weight: 500; }
.cs-p-demo { margin-top: 12px; }
.cs-p-demo button { background: none; border: 1px dashed #c9bcff; color: #5b3fd6; border-radius: 8px; padding: 6px 10px; font: 500 12px/1 Inter, sans-serif; cursor: pointer; }
.rvm-shell-foot .rvm-foot-approve.cs-foot-dl { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
.rvm-shell-foot .rvm-foot-approve.cs-foot-dl svg { width: 16px; height: 16px; }
/* one quiet status rail for every settled state: grey field, dark words, colour only in the dot */
.rvm-shell-foot .rvm-footer-status.cs-rail { width: 100%; background: #f6f6f8; color: #1c1c1c; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 400; }
.rvm-shell-foot .rvm-footer-status.cs-rail i, .cs-foot-status i { width: 8px; height: 8px; border-radius: 999px; background: #896bd9; flex: none; }
.rvm-shell-foot .rvm-footer-status.cs-rail.is-grey i { background: #c2c5c4; }
.rvm-shell-foot .rvm-footer-status.cs-rail b { font-weight: 600; }
.rvm-shell-foot .rvm-footer-status.cs-rail span { color: #717171; }
.cs-foot-status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #52525b; white-space: nowrap; padding: 0 4px; flex: 1; min-width: 0; }
.cs-foot-status b { font-weight: 600; color: #1c1c1c; }
.rvm-precheck-tick.cs-tick-dim { opacity: .28; filter: grayscale(1); }
.rvm-precheck-item.is-dim { color: #717171; }

/* extend sheet (reuses the flag sheet card); compact, scrolls when the window is short */
.rvm-changes-card.cs-sheet { max-height: calc(100vh - 140px); overflow: auto; }
.rvm-changes-card.cs-sheet .rvm-changes-body { padding-top: 40px; }
.rvm-changes-card.cs-sheet .rvm-changes-icon { font-size: 22px; width: 44px; height: 44px; }
.rvm-changes-card.cs-sheet .rvm-changes-title { font-size: 17px; }
.rvm-changes-card.cs-sheet .rvm-changes-sub { font-size: 13px; line-height: 18px; }
.rvm-changes-card.cs-sheet .rvm-changes-footer { position: sticky; bottom: 0; background: #fff; }
.cs-sheet-field { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; }
.cs-sheet-label { font-size: 13px; font-weight: 600; color: #1c1c1c; }
.cs-chips { display: flex; gap: 8px; }
.cs-chip { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid #e3e3e3; background: #fff; color: #1c1c1c; font: 500 13px/1 Inter, sans-serif; cursor: pointer; }
.cs-chip.is-on { background: #1c1c1c; border-color: #1c1c1c; color: #fff; }
.cs-money { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 14px; border: 1px solid #e3e3e3; border-radius: 10px; font-size: 16px; color: #1c1c1c; }
.cs-money:focus-within { border-color: #1c1c1c; }
.cs-money input { width: 100%; border: 0; outline: 0; font: 500 16px/1 Inter, sans-serif; color: #1c1c1c; background: transparent; font-variant-numeric: tabular-nums; }
.cs-sheet-hint { font-size: 12px; color: #717171; line-height: 16px; }
.rvm-changes-card.cs-sheet .rvm-changes-textarea { margin: 0; min-height: 64px; height: 64px; max-height: 180px; resize: vertical; padding: 10px 12px; border: 1px solid #e3e3e3; border-radius: 10px; font-size: 14px; line-height: 20px; width: 100%; }
.rvm-changes-card.cs-sheet .rvm-changes-textarea:focus { border-color: #1c1c1c; }
.rvm-changes-send:disabled { opacity: .4; cursor: default; }

/* toast: top of the window so it never lands on the demo bar */
.cs-toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-8px); background: #1a1a1a; color: #fff; padding: 10px 16px; border-radius: 10px; font: 500 13px/1.3 Inter, ui-sans-serif, system-ui, sans-serif; opacity: 0; pointer-events: none; transition: opacity .15s, transform .15s; z-index: 600; }
.cs-toast.is-on { opacity: 1; transform: translateX(-50%); }

/* ---- demo bar (prototype scaffolding, not product) ---- */
.cs-demo { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 450; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 12px; min-height: 40px; padding: 7px 10px 7px 14px; border-radius: 20px; background: #111; color: #fff; font: 500 12px/1 Inter, ui-sans-serif, system-ui, sans-serif; box-shadow: 0 8px 24px rgba(0,0,0,.28); white-space: nowrap; max-width: calc(100vw - 32px); }
.cs-demo.is-min { bottom: 3px; min-height: 0; padding: 0; background: none; box-shadow: none; }
.cs-demo-group { display: flex; align-items: center; gap: 6px; }
.cs-demo-group.is-off { opacity: .32; pointer-events: none; }
.cs-demo-k { color: #9c9c9c; letter-spacing: .04em; font-size: 11px; }
.cs-demo button { height: 26px; padding: 0 10px; border-radius: 999px; border: 0; background: rgba(255,255,255,.08); color: #ddd; font: 500 12px/1 Inter, sans-serif; cursor: pointer; }
.cs-demo button:hover { background: rgba(255,255,255,.16); }
.cs-demo button.is-on { background: #fff; color: #111; }
.cs-demo button.is-on.is-prod { background: #ffd166; }
.cs-demo button.cs-demo-chip { height: 22px; padding: 0 12px; background: #111; color: #ddd; font-size: 11px; letter-spacing: .02em; }
.cs-demo-sep { width: 1px; height: 18px; background: rgba(255,255,255,.18); flex: none; }
.cs-demo a { color: #bbb; text-decoration: none; padding: 0 6px; }
.cs-demo a:hover { color: #fff; }
body.embed .cs-demo { display: none; }


/* ---- Rights tab: every video and its end date in one table (Creators-card anatomy) ---- */
.nf .stage-top-card.cs-panel--rights { padding: 24px 0; }
.nf .cs-rt-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.nf .cs-rt-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 0 0 16px; flex-wrap: wrap; }
.nf .cs-rt-bar .cs-sum, .nf .cs-rt-bar .cs-bulk { margin: 0; }
.nf .cs-seg { display: inline-flex; border: 1px solid #e3e3e3; border-radius: 10px; overflow: hidden; background: #fff; }
.nf .cs-seg button { height: 34px; padding: 0 12px; font: 500 13px/1 Inter, sans-serif; color: #4b4b4b; cursor: pointer; }
.nf .cs-seg button + button { border-left: 1px solid #e3e3e3; }
.nf .cs-seg button.is-on { background: #1a1a1a; color: #fff; }
.nf .cs-rt-card { border: 1px solid #e3e3e3; border-radius: 16px; background: #fff; overflow: hidden; box-shadow: 0 4px 8px rgba(0,0,0,.03); }
.nf .cs-rt-cols, .nf .cs-rt-row { display: grid; grid-template-columns: 22px minmax(190px, 1.5fr) 84px minmax(120px, .9fr) minmax(150px, 1fr) 172px; gap: 14px; align-items: center; padding: 0 20px; }
.nf .cs-rt-cols { height: 40px; background: #f8f9fa; border-bottom: 1px solid #e3e3e3; font-size: 12px; font-weight: 600; color: #717171; }
.nf .cs-rt-sort { display: inline-flex; align-items: center; gap: 4px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; }
.nf .cs-rt-sort.is-on { color: #1a1a1a; }
.nf .cs-rt-sort span { font-size: 10px; }
.nf .cs-rt-row { min-height: 64px; border-bottom: 1px solid #eeeeee; cursor: pointer; }
.nf .cs-rt-row:last-child { border-bottom: 0; }
.nf .cs-rt-row:hover { background: #fcfcfc; }
.nf .cs-rt-row.is-sel { background: #faf9ff; }
.nf .cs-rt-video { display: flex; align-items: center; gap: 12px; min-width: 0; }
.nf .cs-rt-thumb { width: 36px; height: 48px; border-radius: 6px; overflow: hidden; background: #eee; flex: none; }
.nf .cs-rt-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nf .cs-rt-row.is-pending .cs-rt-thumb img { opacity: .4; filter: grayscale(1); }
.nf .cs-rt-names { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nf .cs-rt-date { font-size: 14px; color: #1a1a1a; font-variant-numeric: tabular-nums; }
.nf .cs-rt-muted { font-size: 13px; color: #767676; }
.nf .cs-rt-end { display: flex; flex-direction: column; gap: 2px; font-variant-numeric: tabular-nums; }
.nf .cs-rt-end b { font-size: 14px; font-weight: 500; color: #1a1a1a; }
.nf .cs-rt-end span { font-size: 12px; color: #6b7280; }
.nf .cs-rt-end.is-ending span { color: #b45309; font-weight: 500; }
.nf .cs-rt-end.is-ended b { color: #767676; }
.nf .cs-rt-status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: #444; white-space: nowrap; }
.nf .cs-rt-status i { width: 8px; height: 8px; border-radius: 999px; background: #2baf87; flex: none; }
.nf .cs-rt-status.is-ending { color: #b45309; }
.nf .cs-rt-status.is-ending i { background: #e88e2c; }
.nf .cs-rt-status.is-ended { color: #767676; }
.nf .cs-rt-status.is-ended i { background: #c2c5c4; }
.nf .cs-rt-status.is-requested { color: #5b3fd6; }
.nf .cs-rt-status.is-requested i { background: #fff; box-shadow: inset 0 0 0 2px #896bd9; }
.nf .cs-rt-status.is-extended { color: #15803d; }
.nf .cs-rt-status.is-pending { color: #767676; }
.nf .cs-rt-status.is-pending i { background: #e3e3e3; }
.nf .cs-rt-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.nf .cs-rt-actions .cs-extend { height: 30px; padding: 0 12px; font-size: 13px; }
.nf .cs-iconbtn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid #e3e3e3; background: #fff; display: grid; place-items: center; color: #1a1a1a; cursor: pointer; flex: none; }
.nf .cs-iconbtn:hover { background: #f7f7f8; }
.nf .cs-iconbtn svg { width: 15px; height: 15px; }
.nf .cs-iconbtn:disabled { color: #c6c6c6; cursor: default; background: #fff; }
.nf .cs-check { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid #c6c6c6; background: #fff; display: grid; place-items: center; cursor: pointer; color: #fff; font-size: 11px; line-height: 1; }
.nf .cs-check[aria-checked="true"], .nf .cs-check[aria-checked="mixed"] { background: #7a5cfa; border-color: #7a5cfa; }
.nf .cs-check:disabled { opacity: .35; cursor: default; }
.nf .cs-bulk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: #1a1a1a; min-height: 28px; margin: 0 0 16px; }
.nf .cs-bulk b { font-weight: 600; }
.nf .cs-bulk .cs-ghost { height: 30px; font-size: 13px; padding: 0 12px; border-radius: 8px; }
.nf .cs-bulk .cs-ghost.is-dark { background: #1a1a1a; border-color: #1a1a1a; color: #fff; }

/* the same dates as a month, behind the Table / Calendar toggle (Vendr's pairing) */
.nf .cs-bigcal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; border-bottom: 1px solid #e3e3e3; background: #f8f9fa; }
.nf .cs-bigcal-head .cs-cal-month { font-size: 15px; }
.nf .cs-bigcal-nav { display: flex; align-items: center; gap: 8px; }
.nf .cs-bigcal-dows, .nf .cs-bigcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.nf .cs-bigcal-dows span { padding: 8px 10px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #767676; text-transform: uppercase; border-bottom: 1px solid #eee; }
.nf .cs-bigday { min-height: 98px; padding: 6px 8px 8px; border-right: 1px solid #f1f1f1; border-bottom: 1px solid #f1f1f1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.nf .cs-bigday:nth-child(7n) { border-right: 0; }
.nf .cs-bigday-n { font-size: 12px; font-weight: 500; color: #1a1a1a; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 999px; font-variant-numeric: tabular-nums; }
.nf .cs-bigday.is-out .cs-bigday-n { color: #b3b3b3; }
.nf .cs-bigday.is-today .cs-bigday-n { background: #7a5cfa; color: #fff; font-weight: 600; }
.nf .cs-bigchip { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 3px; border-radius: 999px; background: #f5f3fc; font-size: 12px; font-weight: 500; color: #1a1a1a; cursor: pointer; min-width: 0; width: 100%; text-align: left; }
.nf .cs-bigchip img { width: 18px; height: 18px; border-radius: 999px; object-fit: cover; object-position: 50% 15%; flex: none; }
.nf .cs-bigchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nf .cs-bigchip.is-ending { background: #fff4e5; color: #b45309; }
.nf .cs-bigchip.is-ended { background: #f1f1f3; color: #767676; }
.nf .cs-bigchip.is-ext { background: #e8f7ef; color: #15803d; }
.nf .cs-bigchip.is-req { background: #fff; box-shadow: inset 0 0 0 1px #c9bcff; color: #5b3fd6; }
.nf .cs-bigmore { font-size: 11px; font-weight: 500; color: #5b3fd6; padding-left: 4px; cursor: pointer; text-align: left; }
.nf .cs-panel--dash .am-update.cs-upd2 > .cp-live { max-width: 100%; min-width: 0; }
.nf .cs-upd-rights > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nf .cs-upd-rights .tf-rowlink { flex: none; }

/* ---- Dashboard variant: a second quiet line under each creator's update + the videos in the drawer ---- */
.nf .cs-panel--dash .am-update.cs-upd2 { flex-direction: column; align-items: flex-start; justify-content: center; gap: 3px; }
.nf .cs-upd-rights { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #6b7280; white-space: nowrap; max-width: 100%; }
.nf .cs-upd-rights i { width: 6px; height: 6px; border-radius: 999px; background: #2baf87; flex: none; }
.nf .cs-upd-rights.is-ending { color: #b45309; font-weight: 500; }
.nf .cs-upd-rights.is-ending i { background: #e88e2c; }
.nf .cs-upd-rights.is-ended { color: #767676; }
.nf .cs-upd-rights.is-ended i { background: #c2c5c4; }
.nf .cs-upd-rights.is-req { color: #5b3fd6; }
.nf .cs-upd-rights.is-req i { background: #896bd9; }
.nf .cs-upd-rights.is-ext { color: #15803d; }
.nf .cs-panel--dash .cs-upd-rights .tf-rowlink { margin-left: 4px; font-weight: 600; }
.nf .cs-dvids { padding: 16px 20px 6px; border-top: 1px dashed #e3e3e3; background: #fcfcfc; }
.nf .cs-dvids-title { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: #717171; }
.nf .cs-dvid { display: grid; grid-template-columns: 36px minmax(0, 1fr) minmax(130px, auto) auto; gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid #f1f1f1; cursor: pointer; }
.nf .cs-dvid:first-of-type { border-top: 0; }
.nf .cs-dvids + .am-hist { border-top: 0; }

/* the extend sheet on its own (table rows and bulk): same card, centred on a scrim */
.rvm.cs-solo .cs-solo-scrim { position: fixed; inset: 0; z-index: 420; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 24px; }
.rvm.cs-solo .rvm-changes-card { position: relative; right: auto; bottom: auto; width: 410px; max-width: 100%; min-height: 0; }


/* ---- Content tab, shelf layout: production's grid untouched, one slim shelf above it ----
   Everything sits on the same 333px tracks, so the shelf, the headings and the cards share one right edge. */
.nf .cs-wrap.cs-wrap--shelf { display: block; padding: 24px 0; }
.nf .cs-flow { display: grid; grid-template-columns: repeat(auto-fill, 333px); gap: 16px; justify-content: start; }
.nf .cs-flow > .cs-span { grid-column: 1 / -1; min-width: 0; }
.nf .cs-wrap--shelf > .cs-toolbar { margin-bottom: 20px; }
.nf .cs-shelf { border: 1px solid #ebebeb; border-radius: 14px; background: #fff; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.nf .cs-shelf-lead { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.nf .cs-shelf-title { font-size: 14px; font-weight: 600; color: #1a1a1a; }
.nf .cs-shelf-sub { font-size: 13px; color: #6b7280; }
.nf .cs-shelf-sub b { font-weight: 500; color: #1a1a1a; }
.nf .cs-shelf-row { display: flex; flex-wrap: wrap; gap: 8px; }
.nf .cs-bucket { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid #ebebeb; background: #fff; cursor: pointer; white-space: nowrap; transition: background-color .12s, border-color .12s; }
.nf .cs-bucket:hover { background: #fafafa; border-color: #d9d9d9; }
.nf .cs-bucket.is-on { border-color: #1a1a1a; box-shadow: inset 0 0 0 1px #1a1a1a; }
.nf .cs-bucket.is-empty { cursor: default; background: #fcfcfc; }
.nf .cs-bucket.is-empty:hover { background: #fcfcfc; border-color: #ebebeb; }
.nf .cs-bucket-label { font-size: 13px; font-weight: 600; color: #1a1a1a; }
.nf .cs-bucket-n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #f1f1f1; color: #4b4b4b; font-size: 12px; font-weight: 500; font-variant-numeric: tabular-nums; }
.nf .cs-bucket.is-empty .cs-bucket-n { background: none; padding: 0; color: #767676; font-weight: 400; }
.nf .cs-bucket.is-empty .cs-bucket-label { color: #767676; font-weight: 500; }
.nf .cs-bucket-faces { display: inline-flex; align-items: center; }
.nf .cs-bucket-faces img { width: 22px; height: 22px; border-radius: 999px; object-fit: cover; object-position: 50% 15%; border: 2px solid #fff; margin-left: -6px; }
.nf .cs-bucket-faces img:first-child { margin-left: 0; }
.nf .cs-bucket-faces img.is-ending { box-shadow: 0 0 0 1.5px #e88e2c; }
.nf .cs-bucket-faces img.is-ended { filter: grayscale(1); opacity: .7; }
.nf .cs-bucket-faces img.is-ext { box-shadow: 0 0 0 1.5px #2baf87; }
.nf .cs-bucket-faces img.is-req { box-shadow: 0 0 0 1.5px #896bd9; }

  const float = sel.length ? `<div class="cs-float"><div class="cs-bulk"><b>${sel.length} selected</b><button class="cs-ghost" data-act="bulk-dl" ${selDl.length ? '' : 'disabled'} title="${selDl.length === sel.length ? 'Download the selected files' : `${sel.length - selDl.length} of these ended, so the file is not available`}">${I.dl}Download${selDl.length !== sel.length ? ` (${selDl.length})` : ''}</button><button class="cs-ghost is-dark" data-act="bulk-extend" ${selExt.length ? '' : 'disabled'} title="${selExt.length === sel.length ? 'Ask to extend the selected videos' : `${sel.length - selExt.length} already have a request in`}">${EXTEND_CTA}${selExt.length !== sel.length ? ` (${selExt.length})` : ''}</button><button class="cs-link" data-act="bulk-clear">Clear</button></div></div>` : '';
  const chipRow = cur ? `<div class="cs-sum cs-span"><button class="cs-chipday" data-bucket="${cur.key}" title="Back to all videos">${cur.label}<span aria-hidden="true">✕</span></button><span><b>${plural(shown.length, 'video')}</b></span><span class="cs-sec-acts"><button class="cs-link" data-act="group-select" data-g="${cur.key}">Select all</button></span></div>` : '';

  /* at most three groups, and only when something needs a decision; otherwise production's own order */
  const sec = (key, label, list, dot) => {
    const ext = list.filter(extendable);
    return `<h3 class="cs-sec cs-span">${dot ? '<i></i>' : ''}${label} <span class="cs-sec-n">${list.length}</span><span class="cs-sec-acts"><button class="cs-link" data-act="group-select" data-g="${key}">Select all</button>${key !== 'active' && ext.length ? `<button class="cs-ghost" data-act="group-extend" data-g="${key}">${ext.length > 1 ? `${EXTEND_CTA} all ${ext.length}` : EXTEND_CTA}</button>` : ''}</span></h3>`;
  };
  const newest = (l) => l.slice().sort((a, b) => b.posted - a.posted);
  let cards;
  if (!shown.length) cards = `<div class="cs-empty cs-span">No videos match this filter.</div>`;
  else if (cur) cards = shown.map(shelfCard).join('');
  else if (!d.ending.length && !d.ended.length) cards = newest(d.active).map(shelfCard).join('');
  else cards = (d.ending.length ? sec('ending', `Ending within ${FORKS.remind} days`, d.ending, true) + d.ending.map(shelfCard).join('') : '')
    + (d.ended.length ? sec('ended', 'Ended', d.ended, false) + d.ended.map(shelfCard).join('') : '')
    + (d.active.length ? sec('active', 'Active', d.active, false) + newest(d.active).map(shelfCard).join('') : '');

  return `<div class="cs-wrap cs-wrap--shelf">
    <div class="cs-toolbar"><div class="cs-filters">${kinds.map(pill).join('')}</div>
      <button class="cs-ghost" data-act="dl-all" data-ids="${dlIds.join(',')}" ${dlIds.length?'':'disabled'} title="${dlIds.length ? 'Downloads each video file, one after the other' : 'No files to download here: rights ended on these videos'}">${I.dl}${!dlIds.length ? 'Download' : scoped ? `Download these (${dlIds.length})` : `Download all (${dlIds.length})`}</button></div>
    <div class="cs-flow${FORKS.tile === 'sm' ? ' cs-flow--sm' : ''}${sel.length ? ' has-sel' : ''}">
    ${shelf}${float}${chipRow}
    ${cards}
  </div></div>`;
}
function shelfGroupIds(key) { const d = shelfData(MODELS()); const b = d.buckets.find(x => x.key === key); return key === 'active' ? d.active.map(m => m.p.id) : b ? b.list.map(m => m.p.id) : []; }

function card(m, prod) {
  const r = rightsLine(m);
  const p = m.p; const c = m.c;
  const platPill = `<span class="cs-plat cs-plat--${m.plat}">${m.plat==='tt'?I.tt:I.ig}${KL[m.kind]}</span>`;
  const who = (meta) => `<div class="cs-who"><span class="cs-avatar"><img src="${c.av}" alt=""></span><div style="min-width:0"><div class="cs-name">${c.name}</div><div class="cs-meta">${c.handle} · ${meta}</div></div></div>`;
  if (prod) {
    return `<div class="cs-card" role="link" tabindex="0" data-prod-card="${p.id}" aria-label="${c.name}, ${KL[m.kind]}: opens the post on ${PLATFORM(m.kind)}">
      <div class="cs-media"><img src="${R}posters/${p.clip}.jpg" alt="">${platPill}</div>
      <div class="cs-body">${who(agoText(m.posted, m.today))}<div class="cs-cap cs-cap--3">${p.cap.join(' ')}</div></div></div>`;
  }
  const meta = m.posted ? fmt(m.posted) : m.approved ? 'draft approved' : 'draft in review';
  const canExtend = !m.requested && (m.state === 'ended' || m.state === 'ending');
  const extendBtn = canExtend ? `<button type="button" class="cs-extend${m.state==='ending'?' is-amber':''}" data-extend="${p.id}" aria-label="Extend the rights on ${first(c)}'s ${KL[m.kind]}">${EXTEND_CTA}</button>` : '';
  const hover = m.state === 'pending' ? `<div class="cs-soon"><span>Not posted yet</span></div>`
    : `<span class="cs-hover"><a class="cs-dl" href="https://${p.url}" target="_blank" rel="noopener" data-openpost="${p.id}" title="Open the live post on ${PLATFORM(m.kind)}">${I.out}See post</a>${m.state!=='ended' ? `<button type="button" class="cs-dl" data-dl="${p.id}" title="Download ${fileName(m)}">${I.dl}Download</button>` : ''}</span>`;
  return `<div class="cs-card${m.state==='pending'?' is-pending':''}" role="button" tabindex="0" data-open="${p.id}" aria-label="${c.name}, ${KL[m.kind]}: ${r.html.replace(/<[^>]+>/g, '')}">
    <div class="cs-media"><img src="${R}posters/${p.clip}.jpg" alt="">${platPill}${hover}</div>
    <div class="cs-body">${who(meta)}
      <div class="cs-cap">${p.cap.join(' ')}</div>
      <div class="cs-rightsrow"><span class="cs-rights ${r.cls}"><i></i><span>${r.html}</span></span>${extendBtn}</div>
    </div></div>`;
}
function agoText(d, today) { const n = diffDays(today, d); if (n < 1) return 'today'; if (n < 7) return `${n}d ago`; if (n < 30) return `${Math.floor(n/7)}w ago`; return `${Math.max(1, Math.round(n/30))}mo ago`; }

/* ---- rail: the rights calendar (month, or faces) ---- */
let calCursor = null;   /* first-of-month being shown */
const dotCls = (m) => m.requested ? 'is-req' : m.state==='ended' ? 'is-ended' : m.extended ? 'is-ext' : m.state==='ending' ? 'is-ending' : '';
function calendar(ms) {
  const today = D(FORKS.today);
  const withEnds = ms.filter(m => m.ends);
  if (!calCursor) {
    /* open on this month when something ends in it, else on the month of the next end */
    const inMonth = withEnds.some(m => m.ends.getFullYear() === today.getFullYear() && m.ends.getMonth() === today.getMonth());
    const next = withEnds.filter(m => m.ends >= today).sort((a, b) => a.ends - b.ends)[0];
    const anchor = inMonth || !next ? today : next.ends;
    calCursor = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  }
  const y = calCursor.getFullYear(), mo = calCursor.getMonth();
  const firstDow = (new Date(y, mo, 1).getDay() + 6) % 7;   /* Monday first */
  const daysIn = new Date(y, mo + 1, 0).getDate();
  const byDay = {};
  withEnds.forEach(m => (byDay[iso(m.ends)] ||= []).push(m));
  const faces = FORKS.cal === 'faces';
  let cells = '';
  for (let i = 0; i < firstDow; i++) cells += `<span class="cs-day is-blank" aria-hidden="true"></span>`;
  for (let d = 1; d <= daysIn; d++) {
    const date = new Date(y, mo, d, 12); const k = iso(date);
    const list = (byDay[k] || []).slice().sort((a,b) => a.p.c.localeCompare(b.p.c));
    const isPast = date < today && k !== iso(today);
    const cls = ['cs-day', list.length?'has':'', isPast?'is-past':'', k===iso(today)?'is-today':'', S.day===k?'is-sel':''].join(' ');
    const marks = faces
      ? `<span class="cs-faces">${(list.length <= 2 ? list : list.slice(0,1)).map(m => `<img src="${m.c.av}" alt="" class="${dotCls(m)}">`).join('')}${list.length>2?`<span class="cs-more">+${list.length-1}</span>`:''}</span>`
      : `<span class="cs-dots">${list.slice(0,3).map(m => `<i class="cs-dot ${dotCls(m)}"></i>`).join('')}</span>`;
    const label = `${MONL[mo]} ${d}${k===iso(today)?', today':''}${list.length ? `, ${plural(list.length,'video')} ${isPast?'ended':'ending'}: ${list.map(m=>`${first(m.c)} (${KL[m.kind]})`).join(', ')}` : ''}`;
    cells += `<button type="button" class="${cls}" aria-label="${label}" ${list.length?`data-day="${k}" aria-pressed="${S.day===k}" title="${list.map(m=>`${first(m.c)} · ${KL[m.kind]}`).join(', ')}"`:'disabled tabindex="-1"'}>${d}${marks}</button>`;
  }
  const tail = (7 - ((firstDow + daysIn) % 7)) % 7;
  for (let i = 0; i < tail; i++) cells += `<span class="cs-day is-blank" aria-hidden="true"></span>`;
  const monthKey = `${y}-${String(mo+1).padStart(2,'0')}`;
  const inThis = withEnds.filter(m => iso(m.ends).startsWith(monthKey));
  const allPast = inThis.length && inThis.every(m => m.daysLeft < 0);
  const sub = inThis.length ? `${plural(inThis.length, 'video')} ${allPast ? 'ended' : `end${inThis.length>1?'':'s'}`} in ${MONL[mo]}. Click a day to see which.` : `Nothing ends in ${MONL[mo]}.`;
  return `<div class="cs-box">
    <div class="cs-box-h"><div class="cs-box-title">Rights calendar</div></div>
    <div class="cs-box-sub">${sub}</div>
    <div class="cs-cal-nav"><button class="cs-cal-btn" data-cal="-1" aria-label="Previous month">${I.chevL}</button><span class="cs-cal-month" aria-live="polite">${MONL[mo]} ${y}</span><button class="cs-cal-btn" data-cal="1" aria-label="Next month">${I.chevR}</button></div>
    <div class="cs-cal${faces?' cs-cal--faces':''}">${['M','T','W','T','F','S','S'].map(d=>`<span class="cs-cal-dow" aria-hidden="true">${d}</span>`).join('')}${cells}</div>
    <div class="cs-legend"><span><i style="background:#e88e2c"></i>ending soon</span><span><i style="background:#896bd9"></i>later</span><span><i style="background:#2baf87"></i>extended</span><span><i class="cs-legend-req"></i>requested</span><span><i style="background:#c2c5c4"></i>ended</span><span><i class="cs-legend-today"></i>today</span></div>
  </div>`;
}

/* ---- rail variant C: the timeline, an agenda by week with the Extend action on the row ---- */
function timeline(ms) {
  const today = D(FORKS.today);
  const items = ms.filter(m => m.ends).slice().sort((a,b) => a.ends - b.ends);
  const past = items.filter(m => m.daysLeft < 0);
  const ahead = items.filter(m => m.daysLeft >= 0);
  const weekOf = (d) => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return iso(x); };
  const thisWeek = weekOf(today);
  const nextWeek = iso(addDays(D(thisWeek), 7));
  const weekLabel = (k) => k === thisWeek ? 'This week' : k === nextWeek ? 'Next week' : `Week of ${fmt(D(k))}`;
  const row = (m) => {
    const sub = m.requested ? 'Extension requested' : m.state === 'ended' ? `Ended ${agoDays(-m.daysLeft)}` : m.extended ? `Extended · ends ${inDays(m.daysLeft)}` : `Ends ${inDays(m.daysLeft)}`;
    const subCls = m.requested ? 'is-req' : m.state === 'ended' ? 'is-ended' : m.extended ? 'is-ext' : m.state === 'ending' ? 'is-ending' : '';
    const canExtend = !m.requested && (m.state === 'ended' || m.state === 'ending');
    return `<div class="cs-tl-row${m.state==='ended'?' is-past':''}${m.state==='ending'?' is-ending':''}" role="button" tabindex="0" data-open="${m.p.id}">
      <span class="cs-tl-date"><b>${m.ends.getDate()}</b><span>${DOW[m.ends.getDay()]}</span></span>
      <span class="cs-avatar"><img src="${m.c.av}" alt=""></span>
      <span class="cs-tl-txt"><span class="cs-tl-name">${first(m.c)} · ${KL[m.kind]}</span><span class="cs-tl-sub ${subCls}">${sub}</span></span>
      ${canExtend ? `<button type="button" class="cs-extend${m.state==='ending'?' is-amber':''}" data-extend="${m.p.id}">${EXTEND_CTA}</button>` : '<span></span>'}
    </div>`;
  };
  let html = '';
  if (past.length) {
    const cut = 3; const shown = S.tlAll ? past : past.slice(-cut);
    html += `<div class="cs-tl-week"><span>Past their end date · ${past.length}</span>${past.length > cut ? `<button class="cs-link" data-tl-more="1">${S.tlAll ? 'Show fewer' : `Show ${past.length - cut} earlier`}</button>` : ''}</div>` + shown.map(row).join('');
  }
  html += `<div class="cs-tl-today">Today · ${fmt(today)}</div>`;
  let lastWeek = null;
  ahead.forEach(m => { const wk = weekOf(m.ends); if (wk !== lastWeek) { html += `<div class="cs-tl-week"><span>${weekLabel(wk)}</span></div>`; lastWeek = wk; } html += row(m); });
  if (!ahead.length) html += `<div class="cs-soon-empty">No rights ending ahead.</div>`;
  return `<div class="cs-box"><div class="cs-box-h"><div class="cs-box-title">Rights timeline</div></div><div class="cs-box-sub">Each video's last day, soonest first. We email you ${FORKS.remind} days before each one.</div><div class="cs-tl">${html}</div></div>`;
}

function endingSoon(ms) {
  const up = ms.filter(m => m.ends && m.daysLeft >= 0 && !m.requested).sort((a,b) => a.ends - b.ends).slice(0, 4);
  const rows = up.length ? up.map(m => `<div class="cs-soon-row"><button class="cs-soon-main" data-open="${m.p.id}"><span class="cs-avatar"><img src="${m.c.av}" alt=""></span><span class="cs-soon-txt"><span class="cs-soon-name">${first(m.c)} · ${KL[m.kind]}</span><span class="cs-soon-when${m.state==='ending'?' is-ending':''}">${fmt(m.ends)} · ends ${inDays(m.daysLeft)}</span></span></button><button type="button" class="cs-extend${m.state==='ending'?' is-amber':''}" data-extend="${m.p.id}" aria-label="Extend the rights on ${first(m.c)}'s ${KL[m.kind]}">${EXTEND_CTA}</button></div>`).join('') : `<div class="cs-soon-empty">No rights ending soon.</div>`;
  return `<div class="cs-box"><div class="cs-box-h"><div class="cs-box-title">Ending next</div></div><div class="cs-box-sub">We email you ${FORKS.remind} days before each one ends.</div><div class="cs-soon-list">${rows}</div></div>`;
}

function about() {
  const how = FORKS.extend === 'price'
    ? `Need longer? Extend from any video: pick how long and what you'd offer, and Katie's team takes it to the creator.`
    : `Need longer? Extend from any video. Katie's team checks with the creator and comes back with a price.`;
  return `<div class="cs-box"><div class="cs-box-title" style="margin-bottom:8px">About your rights</div><div class="cs-about">
    <p>Every video comes with <b>90 days of full usage, paid ads included</b>, counted from the day it goes live.</p>
    <p>Download the original file any time during those 90 days. Light re-edits are fine.</p>
    <p>${how}</p>
  </div></div>`;
}

/* ---- Dashboard tab: the Campaign Pulse as shipped (stat row, stage rail, creators card, rail) ---- */
const STAGES = ['Sourcing', 'Invited', 'Accepted', 'Order shipped', 'Order delivered', 'Draft approved', 'Content published', 'Thanked'];
const RAMP = ['#dbeee3', '#b9dfcb', '#8fceae', '#5fb98c', '#2e9e6b', '#1f8f5a', '#17864f', '#124a33'];
const SAVED = [ { name: 'Tess Nakamura', handle: '@tess.n', av: R+'posters/jasper-1.jpg' }, { name: 'Rae Cole', handle: '@raecole', av: R+'posters/emery-2.jpg' } ];
const relDay = (d, today) => { const n = diffDays(today, d); return n === 0 ? 'today' : n === 1 ? 'yesterday' : fmt(d); };

function crewRows(ms) {
  const today = D(FORKS.today);
  const byC = {};
  ms.forEach(m => (byC[m.p.c] ||= []).push(m));
  return Object.entries(byC).map(([k, list]) => {
    const c = CREATORS[k];
    const live = list.filter(m => m.state !== 'pending').sort((a, b) => a.posted - b.posted);
    if (live.length) {
      const first_ = live[0];
      const update = live.length > 1
        ? `${plural(live.length, 'post')} live · ${KL[first_.kind]} since ${relDay(first_.posted, today)}`
        : `${KL[first_.kind]} live since ${relDay(first_.posted, today)}`;
      return { key: k, c, stage: 6, celebrate: true, update, live, pieces: list };
    }
    const soon = list[0];
    const ok = !!soon.approved;
    return { key: k, c, stage: ok ? 5 : 4, celebrate: false, update: ok ? `Draft approved ${fmt(soon.approved)}, posting soon` : 'Draft in review with Katie\'s team', live: [], pieces: list };
  });
}

function stageHistory(row, prod) {
  const m = row.live[0];
  const ap = row.pieces[0].approved;
  const base = m ? m.posted : ap ? addDays(ap, 9) : addDays(D(FORKS.today), 9);
  const d = (n) => fmt(addDays(base, n));
  const steps = [
    ['Invited', d(-45), 'Matched to your brief'],
    ['Accepted', d(-43), 'Accepted the invite'],
    ['Order shipped', d(-38), 'Repair+ bundle on its way'],
    ['Order delivered', d(-33), 'Package arrived'],
    ['Draft approved', d(-9), 'Katie\'s team checked the draft against your brief'],
    ['Live!', m ? fmt(m.posted) : 'up next', m ? `Post went live on ${PLATFORM(m.kind)}` : 'Post goes live, we track how it does for you'],
    ['Thanked', 'up next', 'Your thank-you, right after the post'],
  ];
  const nowIdx = m ? 5 : ap ? 4 : 3;
  const pick = bestPiece(row.pieces);
  return `<div class="am-hist"><p class="am-hist-title">Stage history</p><div class="cp-crew-history am-hist-body">${steps.map(([label, when, detail], i) => {
    const st = i < nowIdx ? 'done' : i === nowIdx ? 'now' : 'next';
    const liveLine = (st === 'now' && m && !prod) ? `<div class="cp-hist-live"><span class="cp-live"><span class="cp-live-fact cp-live-fact--gray">${rightsLine(pick).html.replace(/<\/?b>/g, '')}</span></span><a class="tf-rowlink" role="button" tabindex="0" data-open="${pick.p.id}">View content <span aria-hidden="true">↗</span></a></div>` : '';
    return `<div class="cp-hist-step cp-hist-step--${st}"><span class="cp-hist-dot">${st === 'done' ? '✓' : ''}</span><div class="cp-hist-body"><div class="cp-hist-top"><span class="cp-hist-label">${label}</span><span class="cp-hist-when">${st === 'next' ? 'up next' : when}</span></div><div class="cp-hist-detail">${detail}</div>${liveLine}</div></div>`;
  }).join('')}</div></div>`;
}

function renderDashboard(ms) {
  const prod = isProd();
  const where = WHERE();
  const dashRights = where === 'dash';
  const extLink = (f) => where === 'tab' ? `<a role="button" tabindex="0" data-tab="rights" data-rtf="${f}">extend</a>` : where === 'dash' ? `extend from the creator's row` : `<a role="button" tabindex="0" data-tab="content">extend</a>`;
  const rows = crewRows(ms);
  const n = rows.length;
  const pct = Math.round(rows.reduce((a, r) => a + r.stage, 0) / (n * 7) * 100);
  const liveVideos = ms.filter(m => m.state !== 'pending').length;
  const counts = STAGES.map((_, i) => rows.filter(r => r.stage === i).length);
  const maxStage = Math.max(...rows.map(r => r.stage));
  const ending = ms.filter(m => m.state === 'ending' && !m.requested).length;
  const ended = ms.filter(m => m.state === 'ended' && !m.requested).length;

  const rail = STAGES.map((label, i) => {
    const count = counts[i];
    const radius = i === 0 ? '74px 4px 4px 74px' : i === STAGES.length - 1 ? '4px 100px 100px 4px' : '4px';
    let bar, hint;
    if (count === 0 && i < maxStage) {
      bar = `<button type="button" disabled class="am2-bar" style="background:#eff5f1;border-radius:${radius}"><span class="am2-count" style="color:#17864f"><span class="am2-check" role="img" aria-label="All ${n} moved ahead">✓</span></span></button>`;
      hint = i === 0 ? 'All done for now' : `All ${n} moved ahead`;
    } else if (count === 0) {
      bar = `<button type="button" disabled class="am2-bar am-seg--sliver" style="border-radius:${radius}"><span class="am2-count" style="color:#a3a8a3">0</span></button>`;
      hint = i === 7 ? 'After posts go live' : i === 6 ? 'Once quality checks pass' : 'Up next';
    } else {
      const dark = i >= 4;
      bar = `<button type="button" tabindex="-1" aria-disabled="true" class="am2-bar" style="cursor:default;background:${RAMP[i]};border-radius:${radius}"><span class="am2-count" style="color:${dark ? '#fff' : '#06301f'}">${count}</span></button>`;
      hint = i === 6 ? `${plural(liveVideos, 'post')} now live!` : i === 5 ? `${count} posting soon` : i === 4 ? `${plural(count, 'draft')} in review` : `${count} here now`;
    }
    return `<div class="am2-col">${bar}<div class="am2-leg"><p class="am2-label">${label}</p><p class="am2-hint">${hint}</p></div></div>`;
  }).join('');

  const chev = (open) => `<span class="am-chev"><img alt="" src="assets/labs/chevron.svg" style="rotate: ${open ? '-90deg' : '90deg'};"></span>`;
  const verified = `<img alt="Verified" class="am-verified" src="${R}assets/icons/verified.svg">`;
  const crew = rows.map(r => {
    const pick = bestPiece(r.pieces);
    const link = (!prod && !dashRights && r.live.length) ? `<a class="tf-rowlink" role="button" tabindex="0" data-open="${pick.p.id}">View content <span aria-hidden="true">↗</span></a>` : '';
    const open = S.rowsOpen.includes(r.key);
    const urgent = r.live.filter(m => !m.requested && (m.state === 'ending' || m.state === 'ended'));
    const rl = r.live.length ? rightsLine(pick) : null;
    const same = rl ? r.live.filter(m => rightsLine(m).html === rl.html).length : 0;
    const scope = r.live.length > 1 ? (same === r.live.length ? ` · ${plural(same, 'video')}` : ` · ${same} of ${r.live.length} videos`) : '';

    const rightsRow = (dashRights && rl) ? `<span class="cs-upd-rights ${rl.cls}"><i></i><span>${rl.html.replace(/<\/?b>/g, '')}${scope}</span>${urgent.length ? `<a class="tf-rowlink" role="button" tabindex="0" data-rt-extend="${urgent.map(m => m.p.id).join(',')}">${EXTEND_CTA}${urgent.length > 1 ? ` ${urgent.length}` : ''}</a>` : ''}</span>` : '';
    const fact = r.celebrate ? `<span class="cp-live-fact"><span class="cp-celebrate-emoji" aria-hidden="true">🎉</span> ${r.update}</span>` : `<span class="cp-live-fact cp-live-fact--gray">${r.update}</span>`;
    return `<div class="am-item"><div role="button" tabindex="0" class="am-row tf-row" aria-expanded="${open}" data-row="${r.key}">
      <span class="am-who"><span><span class="am-avatar"><img alt="" src="${r.c.av}"></span></span><span class="am-names"><span class="am-name">${r.c.name}${verified}</span><span class="am-handle">${r.c.handle}</span></span></span>
      <span class="am-update${rightsRow ? ' cs-upd2' : ''}"><span class="cp-live">${fact}</span>${link}${rightsRow}</span>
      <span class="tf-chipslot"><span class="tf-gdot"><i style="background:${RAMP[r.stage]}"></i>${STAGES[r.stage]}</span></span>${chev(open)}</div>
      <div class="tf-drawer${open ? ' tf-drawer--open' : ''}" aria-hidden="${!open}" ${open ? '' : 'inert'}><div class="tf-drawer-in">${dashRights && r.live.length ? dashVideos(r) : ''}${stageHistory(r, prod || dashRights)}</div></div></div>`;
  }).join('');
  const saved = SAVED.map(c => `<div class="am-item"><div class="am-row tf-row is-static"><span class="am-who"><span><span class="am-avatar"><img alt="" src="${c.av}"></span></span><span class="am-names"><span class="am-name">${c.name}${verified}</span><span class="am-handle">${c.handle}</span></span></span><span class="am-update"><span class="cp-live"><span class="cp-live-fact cp-live-fact--gray">Saved for your next campaign</span></span></span><span class="tf-chipslot"><span class="tf-gdot" style="color:#767676"><i style="background:#c2c5c4"></i>Invite expired<span class="tf-info-i" title="The invite ran out before an answer. The creator stays saved for your next campaign.">ⓘ</span></span></span><span class="am-chev"></span></div></div>`).join('');

  const twice = rows.filter(r => r.live.length > 1).length;
  const activity = [
    `<div class="am-note"><span class="am-note-emoji" aria-hidden="true">🎉</span><p class="am-note-text"><strong>${plural(liveVideos, 'post')} ${liveVideos === 1 ? 'is' : 'are'} live!</strong><span> · Katie's team checked every draft against your brief before it went live${twice ? `; ${plural(twice, 'creator')} shared twice` : ''}.</span></p></div>`,
    ...(!prod && ended ? [`<div class="am-note"><span class="am-note-emoji" aria-hidden="true">⏹️</span><p class="am-note-text"><strong>Rights ended on ${plural(ended, 'video')}</strong><span> · pause any ads still using ${ended > 1 ? 'them' : 'it'}, or ${extLink('ended')}.</span></p></div>`] : []),
  ];
  const upnext = [
    ...(!prod && ending ? [`<div class="am-note"><span class="am-note-emoji" aria-hidden="true">⏳</span><p class="am-note-text"><strong>Rights on ${plural(ending, 'video')} end within ${FORKS.remind} days</strong><span> · download the files and ${extLink('ending')} to keep using them.</span></p></div>`] : []),
    `<div class="am-note"><span class="am-note-emoji" aria-hidden="true">💌</span><p class="am-note-text"><strong>Send thank-yous to ${plural(rows.filter(r => r.live.length).length, 'creator')}</strong><span> · Thoughtful notes help strengthen your creator relationships after their posts went live.</span></p></div>`,
  ];
  const lastify = (arr) => arr.map((x, i) => i === arr.length - 1 ? x.replace('class="am-note"', 'class="am-note am-note--last"') : x).join('');

  return `<div class="cp-root cp-root--c">
    <div class="am-progress"><div class="am-stat"><div class="am-stat-left"><span class="am-stat-big">${pct}%</span><span class="am-stat-cap">through your campaign</span></div></div>
      <div class="am2-rail" role="group" aria-label="Creator funnel: ${pct}% through">${rail}</div></div>
    <div class="cp-crew2 tf-noicons tf-heads-grey"><div class="cp-crew-cols cp-crew-cols--left"><div class="cp-crew-left">
      <section class="am-card am-table tf-table" aria-label="Creators"><div class="am-card-head tf-head"><div class="am-head-l"><div><p class="am-card-title">Creators</p><span class="am-card-sub">Review creator progress below.</span></div></div><div class="am-head-r"></div></div>${crew}${saved}</section>
    </div>
    <aside class="cp-tile-stack"><aside class="am-rail">
      <section class="am-card"><div class="am-card-head"><div class="am-head-l"><div><p class="am-card-title">Recent activity</p></div></div></div><div class="am-card-body">${lastify(activity)}</div></section>
      <section class="am-card"><div class="am-card-head"><div class="am-head-l"><div><p class="am-card-title">Up next</p></div></div></div><div class="am-card-body">${lastify(upnext)}</div></section>
    </aside></aside></div></div></div>`;
}

/* ---- Rights tab: one row per video, sorted by the day its rights end ---- */
const RT_LABEL = { active:'Active', ending:'Ending soon', ended:'Ended', requested:'Extension requested', extended:'Extended', pending:'Not posted yet' };
const RT_FILTERS = [['all','All'], ['ending','Ending soon'], ['active','Active'], ['extended','Extended'], ['requested','Requested'], ['ended','Ended'], ['pending','Not posted']];
const selectable = (m) => m.state !== 'pending';
const extendable = (m) => m.state !== 'pending' && !m.requested;
const usableFile = (m) => m.state !== 'pending' && m.state !== 'ended';
function rtRows(ms) {
  const k = S.rtSort.key, dir = S.rtSort.dir;
  const RANK = { ending: 0, active: 1, requested: 2, extended: 3, ended: 4 };
  const val = (m) => k === 'creator' ? m.c.name.toLowerCase() : k === 'posted' ? m.posted.getTime() : m.ends.getTime();
  const cmp = k === 'attention'
    ? (a, b) => (RANK[a.chip] - RANK[b.chip]) || (a.chip === 'ended' ? b.ends - a.ends : a.ends - b.ends)
    : (a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; };
  const rows = ms.filter(m => S.rtFilter === 'all' || m.chip === S.rtFilter);
  const live = rows.filter(selectable).sort(cmp);
  return live.concat(rows.filter(m => !selectable(m)));   /* not-posted rows always sit last */
}
function endCell(m) {
  if (m.state === 'pending') return `<span class="cs-rt-muted">Starts with the post</span>`;
  const sub = m.daysLeft < 0 ? agoDays(-m.daysLeft) : m.daysLeft === 0 ? 'today' : `in ${plural(m.daysLeft, 'day')}`;
  return `<span class="cs-rt-end${m.state === 'ending' && !m.requested ? ' is-ending' : m.state === 'ended' ? ' is-ended' : ''}"><b>${fmt(m.ends)}</b><span>${sub}</span></span>`;
}
function rowActions(m) {
  if (m.state === 'pending') return '';
  const dl = `<button type="button" class="cs-iconbtn" data-dl="${m.p.id}" ${usableFile(m) ? '' : 'disabled'} title="${usableFile(m) ? `Download ${fileName(m)}` : m.requested ? `Rights ended ${fmt(m.ends)}. Download comes back if ${first(m.c)} says yes.` : `Rights ended ${fmt(m.ends)}. Extend to download again.`}" aria-label="Download ${first(m.c)}'s ${KL[m.kind]}">${I.dl}</button>`;
  const post = `<a class="cs-iconbtn" href="https://${m.p.url}" target="_blank" rel="noopener" data-openpost="${m.p.id}" title="Open the live post on ${PLATFORM(m.kind)}" aria-label="Open the live post">${I.out}</a>`;
  const ext = (m.requested || (m.state !== 'ending' && m.state !== 'ended')) ? '' : `<button type="button" class="cs-extend${m.state === 'ending' ? ' is-amber' : ''}" data-rt-extend="${m.p.id}" aria-label="Extend the rights on ${first(m.c)}'s ${KL[m.kind]}">${EXTEND_CTA}</button>`;
  return ext + post + dl;
}
function renderRights(ms) {
  const live = ms.filter(selectable);
  const counts = {}; ms.forEach(m => counts[m.chip] = (counts[m.chip] || 0) + 1);
  if (S.rtFilter !== 'all' && !counts[S.rtFilter]) S.rtFilter = 'all';
  const pills = RT_FILTERS.filter(([k]) => k === 'all' || counts[k]).map(([k, l]) => `<button class="cs-filter${S.rtFilter===k?' is-on':''}" data-rt-filter="${k}" aria-pressed="${S.rtFilter===k}">${l}<span class="cs-count">${k === 'all' ? ms.length : counts[k]}</span></button>`).join('');
  const rows = rtRows(ms);
  const sel = S.sel.filter(id => rows.some(m => m.p.id === id));
  const selMs = sel.map(id => ms.find(m => m.p.id === id));
  const selDl = selMs.filter(usableFile), selExt = selMs.filter(extendable);
  const usable = live.filter(usableFile);
  const ending = live.filter(m => m.state === 'ending' && !m.requested), ended = live.filter(m => m.state === 'ended' && !m.requested), requested = live.filter(m => m.requested);

  const line = sel.length
    ? `<div class="cs-bulk"><b>${sel.length} selected</b><button class="cs-ghost" data-act="bulk-dl" ${selDl.length ? '' : 'disabled'}>${I.dl}Download${selDl.length && selDl.length !== sel.length ? ` (${selDl.length})` : ''}</button><button class="cs-ghost is-dark" data-act="bulk-extend" ${selExt.length ? '' : 'disabled'}>${EXTEND_CTA}${selExt.length && selExt.length !== sel.length ? ` (${selExt.length})` : ''}</button><button class="cs-link" data-act="bulk-clear">Clear</button></div>`
    : `<div class="cs-sum"><span><b>${plural(live.length, 'video')}</b>, 90 days of usage rights each${ending.length ? ` · <span class="is-amber">${ending.length} ending within ${FORKS.remind} days</span>` : ''}${requested.length ? ` · <span class="is-purple">${plural(requested.length, 'extension')} requested</span>` : ''}${ended.length ? ` · ${ended.length} ended` : ''}</span></div>`;

  const arrow = (k) => S.rtSort.key === k ? `<span aria-hidden="true">${S.rtSort.dir === 1 ? '▲' : '▼'}</span>` : '';
  const sortBtn = (k, label) => `<button type="button" class="cs-rt-sort${S.rtSort.key===k?' is-on':''}" data-rt-sort="${k}" aria-label="Sort by ${label.toLowerCase()}">${label}${arrow(k)}</button>`;
  const selRows = rows.filter(selectable);
  const allState = !sel.length ? 'false' : sel.length === selRows.length ? 'true' : 'mixed';
  const check = (m) => `<button type="button" class="cs-check" role="checkbox" aria-checked="${S.sel.includes(m.p.id)}" data-sel="${m.p.id}" ${selectable(m) ? '' : 'disabled'} aria-label="Select ${first(m.c)}'s ${KL[m.kind]}">${S.sel.includes(m.p.id) ? '✓' : ''}</button>`;

  const table = `<div class="cs-rt-card">
    <div class="cs-rt-cols"><button type="button" class="cs-check" role="checkbox" aria-checked="${allState}" data-sel="all" aria-label="Select all" ${selRows.length ? '' : 'disabled'}>${allState === 'true' ? '✓' : allState === 'mixed' ? '-' : ''}</button>${sortBtn('creator', 'Video')}${sortBtn('posted', 'Posted')}${sortBtn('ends', 'Rights end')}<span>Status</span><span></span></div>
    ${rows.length ? rows.map(m => `<div class="cs-rt-row${S.sel.includes(m.p.id) ? ' is-sel' : ''}${m.state === 'pending' ? ' is-pending' : ''}" role="button" tabindex="0" data-open="${m.p.id}">
      ${check(m)}
      <span class="cs-rt-video"><span class="cs-rt-thumb"><img src="${R}posters/${m.p.clip}.jpg" alt=""></span><span class="cs-rt-names"><span class="cs-name">${m.c.name}</span><span class="cs-meta">${m.c.handle} · ${KL[m.kind]}</span></span></span>
      <span class="cs-rt-date">${m.posted ? fmt(m.posted) : '<span class="cs-rt-muted">Soon</span>'}</span>
      ${endCell(m)}
      <span class="cs-rt-status is-${m.chip}"><i></i>${RT_LABEL[m.chip]}</span>
      <span class="cs-rt-actions">${rowActions(m)}</span>
    </div>`).join('') : `<div class="cs-empty">No videos match this filter.</div>`}
  </div>`;

  return `<div class="cs-toolbar"><div class="cs-filters">${pills}</div></div>
    ${(ended.length && !S.dismissed && S.rtFilter !== 'ended') ? `<div class="cs-notice" role="status"><div><b>Rights ended on ${plural(ended.length, 'video')}.</b> Pause any ads still using ${ended.length>1?'them':'it'}, or extend.</div><div class="cs-notice-actions"><button class="cs-link" data-act="rt-ended">See ${ended.length>1?'them':'it'}</button><button class="cs-x" data-act="dismiss" aria-label="Dismiss">✕</button></div></div>` : ''}
    <div class="cs-rt-bar">${line}
      <div class="cs-rt-tools"><div class="cs-seg" role="group" aria-label="View"><button data-rt-view="table" class="${S.rtView==='table'?'is-on':''}" aria-pressed="${S.rtView==='table'}">Table</button><button data-rt-view="calendar" class="${S.rtView==='calendar'?'is-on':''}" aria-pressed="${S.rtView==='calendar'}">Calendar</button></div>
        <button class="cs-ghost" data-act="dl-all" ${usable.length?'':'disabled'} title="Downloads each video file, one after the other">${I.dl}Download all (${usable.length})</button></div>
    </div>
    ${S.rtView === 'calendar' ? bigCalendar(ms) : table}`;
}

/* the month, Vendr style: each video sits on its last day as a named chip; a click opens it */
function ensureCursor(ms) {
  if (calCursor) return;
  const today = D(FORKS.today);
  const withEnds = ms.filter(m => m.ends && (S.tab !== 'rights' || S.rtFilter === 'all' || m.chip === S.rtFilter));
  const inMonth = withEnds.some(m => m.ends.getFullYear() === today.getFullYear() && m.ends.getMonth() === today.getMonth());
  const next = withEnds.filter(m => m.ends >= today).sort((a, b) => a.ends - b.ends)[0];
  const anchor = inMonth || !next ? today : next.ends;
  calCursor = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
}
function bigCalendar(ms) {
  ensureCursor(ms);
  const today = D(FORKS.today);
  const y = calCursor.getFullYear(), mo = calCursor.getMonth();
  const firstDow = (new Date(y, mo, 1).getDay() + 6) % 7;
  const daysIn = new Date(y, mo + 1, 0).getDate();
  const cellsN = Math.ceil((firstDow + daysIn) / 7) * 7;
  const byDay = {};
  ms.filter(m => m.ends && (S.rtFilter === 'all' || m.chip === S.rtFilter)).forEach(m => (byDay[iso(m.ends)] ||= []).push(m));
  let cells = '';
  for (let i = 0; i < cellsN; i++) {
    const date = new Date(y, mo, i - firstDow + 1, 12); const k = iso(date);
    const out = date.getMonth() !== mo;
    const list = byDay[k] || [];
    const chips = (S.bigDay === k ? list : list.slice(0, 2)).map(m => `<button type="button" class="cs-bigchip ${dotCls(m)}" data-open="${m.p.id}" title="${m.c.name} · ${KL[m.kind]} · ${RT_LABEL[m.chip]}"><img src="${m.c.av}" alt=""><span>${first(m.c)} · ${KL[m.kind]}</span></button>`).join('');
    cells += `<div class="cs-bigday${out ? ' is-out' : ''}${k === iso(today) ? ' is-today' : ''}"><span class="cs-bigday-n">${date.getDate()}</span>${chips}${list.length > 2 ? `<button type="button" class="cs-bigmore" data-bigday="${k}">${S.bigDay === k ? 'Show fewer' : `${list.length - 2} more`}</button>` : ''}</div>`;
  }
  return `<div class="cs-rt-card">
    <div class="cs-bigcal-head"><span style="display:flex;align-items:baseline;gap:12px"><span class="cs-cal-month" aria-live="polite">${MONL[mo]} ${y}</span>${Object.keys(byDay).some(k => k.startsWith(`${y}-${String(mo+1).padStart(2,'0')}`)) ? '' : `<span class="cs-rt-muted">Nothing ends this month${S.rtFilter !== 'all' ? ' with this filter' : ''}</span>`}</span><div class="cs-bigcal-nav"><button class="cs-ghost" style="height:30px;font-size:13px" data-act="cal-today">Today</button><button class="cs-cal-btn" data-cal="-1" aria-label="Previous month">${I.chevL}</button><button class="cs-cal-btn" data-cal="1" aria-label="Next month">${I.chevR}</button></div></div>
    <div class="cs-bigcal-dows">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cs-bigcal">${cells}</div>
  </div>`;
}

/* Dashboard variant: the creator's videos listed at the top of the row drawer */
function dashVideos(r) {
  return `<div class="cs-dvids"><p class="cs-dvids-title">Videos and usage rights</p>${r.live.map(m => `<div class="cs-dvid" role="button" tabindex="0" data-open="${m.p.id}">
      <span class="cs-rt-thumb"><img src="${R}posters/${m.p.clip}.jpg" alt=""></span>
      <span class="cs-rt-names"><span class="cs-name">${KL[m.kind]} · posted ${fmt(m.posted)}</span><span class="cs-rt-status is-${m.chip}" style="font-size:12px"><i></i>${RT_LABEL[m.chip]}</span></span>
      ${endCell(m)}
      <span class="cs-rt-actions">${rowActions(m)}</span>
    </div>`).join('')}</div>`;
}

/* ==================================================================
   POPUP · the review shell, reused: creators left, video centre, rights right
   ================================================================== */
function meter(m) {
  if (m.state === 'pending') return `<div class="cs-meter cs-meter--pending"><div class="cs-meter-top"><b>Not posted yet</b><span>90 days from the post</span></div><div class="cs-meter-bar"></div><div class="cs-meter-labels"><span>Post goes live</span><span>Rights end</span></div></div>`;
  const pct = (m.dayNum / m.total) * 100;
  const ext = m.extended ? `<span class="cs-meter-ext" style="left:${(RIGHTS_DAYS / m.total) * 100}%"></span>` : '';
  const top = m.state === 'ended'
    ? `<b>Ended ${agoDays(-m.daysLeft)}</b><span>${m.total} days used</span>`
    : `<b>Day ${m.dayNum} of ${m.total}</b><span>${m.daysLeft === 0 ? 'ends today' : plural(m.daysLeft, 'day') + ' left'}</span>`;
  return `<div class="cs-meter cs-meter--${m.tone}"><div class="cs-meter-top">${top}</div><div class="cs-meter-bar" role="img" aria-label="${m.state === 'ended' ? `Rights ended ${fmt(m.ends)}` : `Day ${m.dayNum} of ${m.total}, rights end ${fmt(m.ends)}`}">${ext}<span class="cs-meter-fill" style="width:${pct}%"></span>${m.state !== 'ended' ? `<span class="cs-meter-today" style="left:${pct}%" title="Today"></span>` : ''}</div>
    <div class="cs-meter-labels"><span>Posted ${fmt(m.posted)}</span><span>${m.state==='ended'?'Ended':'Ends'} ${fmt(m.ends)}</span></div></div>`;
}

function renderPopup(ms) {
  const cur = ms.find(m => m.p.id === S.open) || ms[0];
  const creators = [];
  ms.forEach(m => { let g = creators.find(x => x.key === m.p.c); if (!g) { g = { key:m.p.c, c:m.c, list:[] }; creators.push(g); } g.list.push(m); });
  const grp = creators.find(g => g.key === cur.p.c);
  const idx = grp.list.indexOf(cur);
  const n = first(cur.c);
  const live = cur.state !== 'pending';

  const side = creators.map(g => {
    const lv = g.list.filter(m => m.state !== 'pending');
    let line, lineCls = '', slot = '';
    const tick = `<span class="rvm-side-tick"><svg viewBox="0 0 12 12" fill="none"><path d="M2.4 6.4 5 9l4.6-6" stroke="#12A150" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
    if (!lv.length) line = 'Not posted yet';
    else {
      const ending = lv.filter(m => m.state === 'ending' && !m.requested).sort((a,b)=>a.ends-b.ends);
      const endedOpen = lv.filter(m => m.state === 'ended' && !m.requested).sort((a,b)=>a.ends-b.ends);
      const soonest = lv.slice().sort((a,b)=>a.ends-b.ends)[0];
      if (ending.length) { line = `Rights end ${inDays(ending[0].daysLeft)}`; lineCls = 'is-ending'; slot = `<span class="rvm-side-dot" aria-label="Ending soon"></span>`; }
      else if (endedOpen.length) { line = `Rights ended ${fmt(endedOpen[0].ends)}`; lineCls = 'is-ended'; slot = `<span class="rvm-side-tick cs-tick-grey">•</span>`; }
      else if (lv.some(m => m.requested)) { line = 'Extension requested'; lineCls = 'is-req'; slot = `<span class="rvm-side-tick cs-tick-req">…</span>`; }
      else if (lv.some(m => m.extended)) { line = `Extended · until ${fmt(lv.find(m=>m.extended).ends)}`; lineCls = 'is-ext'; slot = tick; }
      else line = `${plural(lv.length, 'video')} · until ${fmt(soonest.ends)}`;
    }
    return `<button type="button" class="rvm-side-row${g.key===cur.p.c?' is-active':''}${lv.length?'':' is-pending-row'}" data-open="${bestPiece(g.list).p.id}">
      <span class="rvm-side-avatar"><img src="${g.c.av}" alt=""></span>
      <span class="rvm-side-names"><span class="rvm-side-name">${g.c.name}<img src="${R}assets/icons/verified.svg" alt="" class="rvm-side-verified"></span><span class="rvm-side-line ${lineCls}">${line}</span></span>
      <span class="rvm-side-slot">${slot}</span></button>`;
  }).join('');

  const kindIcon = cur.kind === 'TikTok'
    ? `<span class="rvm-ig-icon"><img src="${R}assets/icons/tiktok-inner.svg" alt="" class="rvm-ig-icon-inner"><img src="${R}assets/icons/tiktok-outer.svg" alt="" class="rvm-tiktok-icon-outer"></span>`
    : cur.kind === 'IG Story' ? `<span class="rvm-ig-icon"><img src="${R}assets/icons/instagram-story.svg" alt="" class="rvm-ig-icon-outer"></span>`
    : `<span class="rvm-ig-icon"><img src="${R}assets/icons/instagram-outer.svg" alt="" class="rvm-ig-icon-outer"><img src="${R}assets/icons/instagram-inner.svg" alt="" class="rvm-ig-icon-inner"></span>`;

  const stage = `<div class="rvm-stage-pill">
      ${grp.list.length>1 ? `<button type="button" class="rvm-pill-arrow" ${idx<=0?'disabled':''} data-open="${idx>0?grp.list[idx-1].p.id:''}" title="Previous video" aria-label="Previous video"><img src="${R}assets/icons/chevron-12.svg" alt="" class="rvm-chev12-left"></button>` : ''}
      <span class="rvm-pill-label">Video ${idx+1} of ${grp.list.length} · ${KL[cur.kind]}${cur.state==='ended'?' (ended)':''}</span>
      ${grp.list.length>1 ? `<button type="button" class="rvm-pill-arrow" ${idx>=grp.list.length-1?'disabled':''} data-open="${idx<grp.list.length-1?grp.list[idx+1].p.id:''}" title="Next video" aria-label="Next video"><img src="${R}assets/icons/chevron-12.svg" alt=""></button>` : ''}
    </div>
    <div class="rvm-stage-content"><div class="rvm-stage-video-slot"><div class="rvm-video-frame">
        <video class="rvm-video-el" id="vid" src="${R}videos/${cur.p.clip}.mp4" poster="${R}posters/${cur.p.clip}.jpg" preload="metadata" playsinline muted loop></video>
        <div class="rvm-video-badge">${kindIcon}${cur.kind}</div>
        <button type="button" class="rvm-video-sound is-muted" id="snd" title="Unmute" aria-label="Unmute"><img src="${R}assets/video/sound-btn.svg" alt=""></button>
        <button type="button" class="rvm-video-play-overlay" id="playo" title="Play" aria-label="Play"><img src="${R}assets/video/play-btn.svg" alt=""></button>
      </div></div>

  } else if (cur.requested) {

  } else if (cur.state === 'ended') {

    foot = `<button type="button" class="rvm-foot-approve" data-act="sheet" data-id="${cur.p.id}">${EXTEND_CTA}</button>`;
  } else if (cur.extended) {
    h = `Rights run to ${ends}`; sub = `${n} agreed to ${cur.ext.days} more days. Ads and reposts can keep running until then.`;
    foot = `${extBtn('Extend again')}${dlBtn()}`;
  } else if (cur.state === 'ending') {
    h = cur.daysLeft === 0 ? 'Rights end today' : `Rights end in ${plural(cur.daysLeft, 'day')}`;
    sub = `${cur.downloaded ? '' : 'Download the file now. '}After ${ends}, ads and reposts using this video should stop unless you extend.`;
    foot = `${extBtn()}${dlBtn()}`;
  } else {
    h = 'Ready to use'; sub = `Full usage rights, paid ads included, until ${ends}. The original file is yours to download.`;
    foot = `${extBtn()}${dlBtn()}`;
  }

  const tick = `<img src="${R}assets/icons/precheck-tick.svg" alt="" class="rvm-precheck-tick">`;
  const dim = `<img src="${R}assets/icons/precheck-tick.svg" alt="" class="rvm-precheck-tick cs-tick-dim">`;
  const item = (t, x, d) => `<li class="rvm-precheck-item${d ? ' is-dim' : ''}">${t}${x}</li>`;
  const rightsItems = !live
    ? item(tick, '90 days of full usage, paid ads included') + item(dim, 'Starts the day the post goes live', true) + item(dim, 'Original file, light re-edits are fine', true)

const sheetUntil = (cur, days) => fmt(addDays(cur.state === 'ended' ? D(FORKS.today) : cur.ends, days));
const sheetList = () => (S.sheetSolo ? S.sheetIds : [S.sheet]).filter(Boolean).map(id => model(pieceOf(id)));
const sheetHint = (list) => {
  if (list.length === 1) return list[0].state === 'ended' ? `Rights would run ${S.sheetDays} days from the day ${first(list[0].c)} says yes.` : `Rights would run to ${sheetUntil(list[0], S.sheetDays)}.`;
  const ended = list.filter(m => m.state === 'ended').length;
  return ended === list.length ? `Each video's new period starts when the creator says yes.`
    : ended ? `New periods follow on from each video's end date. Videos whose rights already ended start again when the creator says yes.`
    : `Each video's new period follows on from its own end date.`;
};
function sheetHtml(list, solo) {

      : `Tell us how long you'd like to keep using ${n}'s video. Katie's team checks with ${n} and comes back with a price, usually $50 to $100 per video.`)
    : (price
      ? `Pick how long and what you'd offer per video. Katie's team sends the offer to each creator and tells you who accepts.`
      : `Tell us how long you'd like to keep using these ${list.length} videos. Katie's team checks with each creator and comes back with a price, usually $50 to $100 per video.`);
  const chips = [30,60,90].map(d => `<button type="button" class="cs-chip${S.sheetDays===d?' is-on':''}" data-days="${d}" aria-pressed="${S.sheetDays===d}">${d} days</button>`).join('');
  const offerLabel = one ? `Your offer to ${n}` : 'Your offer per video';
  const offerHint = one ? `Most creators accept $50 to $100 per video. ${n} can say no or ask for more.` : `Most creators accept $50 to $100 per video. Each one can say no or ask for more.`;
  return `<div class="${solo ? 'cs-solo-scrim' : 'rvm-changes-scrim'}" data-act="sheet-close"><div class="rvm-changes-card cs-sheet" role="dialog" aria-modal="true" aria-label="${title}">
    <button type="button" class="rvm-changes-close" data-act="sheet-close" title="Close" aria-label="Close"><img src="${R}assets/icons/close-16.svg" alt=""></button>
    <div class="rvm-changes-body"><span class="rvm-changes-icon" aria-hidden="true">🗓️</span><p class="rvm-changes-title">${title}</p><p class="rvm-changes-sub">${sub}</p>
      ${one ? '' : `<p class="cs-sheet-names">${list.map(m => `${first(m.c)} · ${KL[m.kind]}`).join(', ')}${S.sheetSkipped ? `. ${plural(S.sheetSkipped, 'selected video')} already ${S.sheetSkipped > 1 ? 'have' : 'has'} a request in and ${S.sheetSkipped > 1 ? 'are' : 'is'} left out.` : ''}</p>`}
      <div class="cs-sheet-field"><span class="cs-sheet-label" id="lblDays">How long</span><div class="cs-chips" role="group" aria-labelledby="lblDays">${chips}</div><span class="cs-sheet-hint" id="sheetHint">${sheetHint(list)}</span></div>
      ${price ? `<div class="cs-sheet-field"><label class="cs-sheet-label" for="offer">${offerLabel}</label><div class="cs-money"><span aria-hidden="true">$</span><input id="offer" type="number" min="1" step="5" value="${S.sheetOffer}" inputmode="numeric"></div><span class="cs-sheet-hint">${offerHint}</span></div>` : ''}
      <div class="cs-sheet-field"><label class="cs-sheet-label" for="sheetText">Anything to add <span style="color:#767676;font-weight:400">· optional</span></label><textarea class="rvm-changes-textarea" id="sheetText" placeholder="For example, where you plan to run it">${esc(S.sheetText)}</textarea></div>
    </div>
    <div class="rvm-changes-footer"><button type="button" class="rvm-changes-send" data-act="sheet-send" data-id="${one ? one.p.id : ''}" ${price && !(S.sheetOffer > 0) ? 'disabled' : ''}>${price ? (one ? 'Send offer' : `Send ${list.length} offers`) : "Send to Katie's team"}</button></div>
  </div></div>`;
}
const renderSheet = (cur) => sheetHtml([cur], false);
function renderSolo(ms) {
  const list = S.sheetIds.map(id => ms.find(m => m.p.id === id)).filter(Boolean);
  if (!list.length) { S.sheetSolo = false; return; }
  document.body.insertAdjacentHTML('beforeend', `<div class="rvm cs-solo">${sheetHtml(list, true)}</div>`);
}

function wireVideo() {
  const v = document.getElementById('vid'); const po = document.getElementById('playo'); const snd = document.getElementById('snd');
  if (!v) return;
  const toggle = () => { if (v.paused) v.play().catch(()=>{}); else v.pause(); };
  v.addEventListener('click', toggle); po.addEventListener('click', toggle);
  v.addEventListener('play', () => po.style.display = 'none'); v.addEventListener('pause', () => po.style.display = '');
  snd.addEventListener('click', () => { v.muted = !v.muted; snd.classList.toggle('is-muted', v.muted); const t = v.muted ? 'Unmute' : 'Mute'; snd.title = t; snd.setAttribute('aria-label', t); });
}

/* ==================================================================

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('is-on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('is-on'), 1800); }
function markDownloaded(id) { S.downloads[id] = FORKS.today; save('downloads', S.downloads); }
function downloadPiece(m) { const a = document.createElement('a'); a.href = `${R}videos/${m.p.clip}.mp4`; a.download = fileName(m); document.body.appendChild(a); a.click(); a.remove(); markDownloaded(m.p.id); }
function openSheet(id) {

const pieceOf = (id) => PIECES.find(p => p.id === id);

document.addEventListener('click', (e) => {

  const el = (sel) => t.closest(sel);
